<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
/* Typeshelf panel, shared by the Photoshop, Illustrator and After Effects plugins (copied by `npm run plugins:sync`). */
:root {
  --ts-text: #e8e8ea;
  --ts-muted: #9a9aa2;
  --ts-line: rgba(255, 255, 255, 0.1);
  --ts-field: rgba(255, 255, 255, 0.06);
  --ts-accent: #2f80ed;
  --ts-green: #34c759;
  --ts-orange: #ff9f0a;
  --ts-red: #ff5a4f;
}
body.light {
  --ts-text: #1f1f22;
  --ts-muted: #6b6b73;
  --ts-line: rgba(0, 0, 0, 0.12);
  --ts-field: rgba(0, 0, 0, 0.05);
}
body {
  margin: 0;
  padding: 10px 12px;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  font-size: 12px;
  color: var(--ts-text);
}
.muted { color: var(--ts-muted); }
.connection { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ts-muted); display: inline-block; }
.dot.ok { background: var(--ts-green); }
.dot.off { background: var(--ts-red); }
.doc { margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fonts { list-style: none; margin: 0 0 8px; padding: 0; border-top: 1px solid var(--ts-line); }
.fonts li { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--ts-line); }
.fonts .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { flex: none; font-size: 10.5px; padding: 1px 6px; border-radius: 9px; background: var(--ts-field); color: var(--ts-muted); }
.chip.missing { color: var(--ts-orange); }
.chip.activated, .chip.google { color: var(--ts-green); }
.chip.unavailable, .chip.error { color: var(--ts-red); }
.chip.unknown { font-style: italic; }
.message { margin: 6px 0; color: var(--ts-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.actions button {
  font: inherit;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--ts-line);
  background: var(--ts-field);
  color: var(--ts-text);
  cursor: pointer;
}
.actions button.primary { background: var(--ts-accent); border-color: transparent; color: #fff; }
.actions button.is-disabled { opacity: 0.45; cursor: default; }
.detail { margin: -4px 0 8px; color: var(--ts-muted); font-size: 11px; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; flex-direction: row; align-items: center; gap: 6px; }
.options select { font: inherit; color: inherit; background: var(--ts-field); border: 1px solid var(--ts-line); border-radius: 5px; padding: 2px 4px; }

body { margin: 0; padding: 8px; background: var(--figma-color-bg, #2c2c2c); color: var(--figma-color-text, #fff); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
/*
 * Typeshelf panel shared by every Typeshelf plugin (Photoshop, Illustrator, After Effects, InDesign, Figma).
 * Source of truth: plugins/shared/panel-core.js; `npm run plugins:sync` copies it
 * into each plugin folder, which must stay self-contained to be installed.
 *
 * The host adapter provides:
 *   name                      "Photoshop", "Illustrator"…
 *   call(method, path, body)  → Promise<parsed JSON>, rejects with an Error
 *   documentFonts()           → Promise<{ name, fonts: [{ name, installed }] } | null>
 *                               installed: true, false, or null when the host cannot tell
 *                               (Typeshelf then asks the operating system)
 *                               appLists: the app lists the font, but its list may be stale
 *                               (Photoshop keeps deactivated fonts); it then counts as
 *                               missing only if the system lacks it and Typeshelf holds it,
 *                               so fonts private to the app are not reported
 *   onDocumentChange(cb)      calls cb when a document is opened or brought forward
 *
 * and, optionally, what Typeshelf may ask of the application (the panel then polls for it):
 *   applyFont(psName)         → Promise<{ count } | { retry: true } | { error }>
 *                               retry: the application does not list the font yet
 *   selection()               → Promise<{ text, font, size, color, tracking, count } | { error }>
 *                               the selected text and the style of its first character
 * where error is "no_document", "no_selection" or a message.
 */
(function (root) {
  "use strict";

  // English texts are the keys; French is used when the system language is French.
  var FR = {
    "Installed": "Installée",
    "Missing": "Manquante",
    "Activated": "Activée",
    "Not found": "Introuvable",
    "Error": "Erreur",
    "To check": "À vérifier",
    "Connecting to Typeshelf…": "Connexion à Typeshelf…",
    "Typeshelf connected": "Typeshelf connecté",
    "Typeshelf is not open": "Typeshelf n'est pas ouvert",
    "No document open.": "Aucun document ouvert.",
    "This document uses no fonts.": "Ce document n'utilise aucune police.",
    "Document": "Document",
    "Activating…": "Activation…",
    "Activate {n} font": "Activer {n} police",
    "Activate {n} fonts": "Activer {n} polices",
    "Nothing to activate": "Rien à activer",
    "Check again": "Revérifier",
    "Activate automatically on open": "Activer automatiquement à l'ouverture",
    "Look for missing ones on Google Fonts": "Chercher les absentes sur Google Fonts",
    "Duration": "Durée",
    "Until Typeshelf quits": "Jusqu'à la fermeture de Typeshelf",
    "Permanently": "Durablement",
    "Could not read the document: {error}": "Lecture du document impossible : {error}",
    "{n} font activated": "{n} police activée",
    "{n} fonts activated": "{n} polices activées",
    "{n} not found": "{n} introuvable",
    "{n} not found (several)": "{n} introuvables",
    "None of these fonts is in Typeshelf": "Aucune de ces polices n'est dans Typeshelf",
    "None of these fonts is in Typeshelf or on Google Fonts": "Aucune de ces polices n'est dans Typeshelf ni sur Google Fonts",
    "Typeshelf is not responding": "Typeshelf ne répond pas",
    "Typeshelf is not open or does not accept plugins.": "Typeshelf n'est pas ouvert ou n'accepte pas les plugins.",
    "Error {status}": "Erreur {status}",
    "Typeshelf does not recognise this plugin: install it again from Typeshelf.": "Typeshelf ne reconnaît pas ce plugin : réinstallez-le depuis Typeshelf.",
    "the application script failed": "script de l'application en erreur",
    "Preview in Typeshelf": "Aperçu dans Typeshelf",
    "Select some text first.": "Sélectionnez d'abord du texte.",
  };
  var french = /^fr\b/i.test((typeof navigator !== "undefined" && navigator.language) || "");

  function t(text, vars) {
    var out = (french && FR[text]) || text.replace(/ \(several\)$/, "");
    for (var k in vars || {}) out = out.split("{" + k + "}").join(String(vars[k]));
    return out;
  }

  var STATUS_TEXT = {
    installed: "Installed",
    missing: "Missing",
    activated: "Activated",
    google: "Google Fonts",
    unavailable: "Not found",
    error: "Error",
    unknown: "To check",
  };

  var POLL_MS = 1000;
  var IDLE_MS = 5000; // while Typeshelf does not answer
  var APPLY_RETRY_MS = 750;
  var APPLY_RETRIES = 8;

  function messageOf(e) {
    return e && e.message ? e.message : String(e);
  }

  function create(host, container) {
    var prefs = loadPrefs();
    var state = { connected: null, connectionError: "", doc: null, results: {}, busy: false, message: "" };
    var checking = false;
    var can = [];
    if (host.applyFont) can.push("apply");
    if (host.selection) can.push("selection");
    var commands = Promise.resolve();
    var pollFailures = 0;

    function loadPrefs() {
      var p = { auto: true, google: true, scope: "temporary" };
      try {
        var saved = JSON.parse(localStorage.getItem("typeshelf-prefs") || "{}");
        if (typeof saved.auto === "boolean") p.auto = saved.auto;
        if (typeof saved.google === "boolean") p.google = saved.google;
        if (saved.scope === "persistent") p.scope = "persistent";
      } catch (e) {
        /* defaults */
      }
      return p;
    }

    function savePrefs() {
      try {
        localStorage.setItem("typeshelf-prefs", JSON.stringify(prefs));
      } catch (e) {
        /* storage unavailable */
      }
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return "&#" + c.charCodeAt(0) + ";";
      });
    }

    function missingNames() {
      if (!state.doc) return [];
      return state.doc.fonts
        .filter(function (f) {
          return f.installed === false;
        })
        .map(function (f) {
          return f.name;
        });
    }

    function statusOf(font) {
      var r = state.results[font.name];
      if (typeof font.installed !== "boolean") return "unknown";
      if (font.installed) return r && r.status === "activated" ? (r.source === "google" ? "google" : "activated") : "installed";
      if (!r) return "missing";
      if (r.status === "error") return "error";
      if (r.status === "missing") return "unavailable";
      // Activated by Typeshelf but the app has not refreshed its font list yet.
      return r.source === "google" ? "google" : "activated";
    }

    function render() {
      var missing = missingNames();
      var fonts = state.doc ? state.doc.fonts.slice() : [];
      fonts.sort(function (a, b) {
        return Number(a.installed) - Number(b.installed) || a.name.localeCompare(b.name);
      });
      var connection =
        state.connected === null
          ? '<span class="dot"></span>' + t("Connecting to Typeshelf…")
          : state.connected
            ? '<span class="dot ok"></span>' + t("Typeshelf connected")
            : '<span class="dot off"></span>' + t("Typeshelf is not open");
      var list = !state.doc
        ? '<p class="muted">' + t("No document open.") + "</p>"
        : !fonts.length
          ? '<p class="muted">' + t("This document uses no fonts.") + "</p>"
          : '<ul class="fonts">' +
            fonts
              .map(function (f) {
                var s = statusOf(f);
                var r = state.results[f.name];
                var title = r && r.message ? ' title="' + esc(r.message) + '"' : "";
                return '<li><span class="name">' + esc(f.name) + '</span><span class="chip ' + s + '"' + title + ">" + t(STATUS_TEXT[s]) + "</span></li>";
              })
              .join("") +
            "</ul>";
      var activateOff = state.busy || !missing.length || !state.connected;
      // Plain <div> rows: UXP does not lay out a checkbox inside a flex <label>.
      var option = function (id, on, text) {
        return '<div class="opt"><input type="checkbox" id="' + id + '"' + (on ? " checked" : "") + " /><span>" + text + "</span></div>";
      };
      container.innerHTML =
        '<div class="connection">' + connection + "</div>" +
        (state.connected === false && state.connectionError ? '<p class="detail">' + esc(state.connectionError) + "</p>" : "") +
        (state.doc ? '<div class="doc"><span class="muted">' + t("Document") + "</span> " + esc(state.doc.name) + "</div>" : "") +
        list +
        (state.message ? '<p class="message">' + esc(state.message) + "</p>" : "") +
        '<div class="actions">' +
        '<button id="ts-activate" class="primary' + (activateOff ? ' is-disabled" disabled' : '"') + ">" +
        (state.busy ? t("Activating…") : missing.length ? t(missing.length > 1 ? "Activate {n} fonts" : "Activate {n} font", { n: missing.length }) : t("Nothing to activate")) +
        "</button>" +
        '<button id="ts-check"' + (state.busy ? ' class="is-disabled" disabled' : "") + ">" + t("Check again") + "</button>" +
        (host.selection ? '<button id="ts-preview"' + (state.connected ? "" : ' class="is-disabled" disabled') + ">" + t("Preview in Typeshelf") + "</button>" : "") +
        "</div>" +
        '<div class="options">' +
        option("ts-auto", prefs.auto, t("Activate automatically on open")) +
        option("ts-google", prefs.google, t("Look for missing ones on Google Fonts")) +
        '<div class="opt"><span>' + t("Duration") + '</span><select id="ts-scope">' +
        '<option value="temporary"' + (prefs.scope === "temporary" ? " selected" : "") + ">" + t("Until Typeshelf quits") + "</option>" +
        '<option value="persistent"' + (prefs.scope === "persistent" ? " selected" : "") + ">" + t("Permanently") + "</option>" +
        "</select></div>" +
        "</div>";
    }

    function ping() {
      return host.call("GET", "/v1/status").then(
        function () {
          state.connected = true;
          state.connectionError = "";
        },
        function (e) {
          state.connected = false;
          state.connectionError = messageOf(e);
        },
      );
    }

    function check(auto) {
      if (checking) return Promise.resolve();
      checking = true;
      return Promise.all([
        host.documentFonts().then(
          function (doc) {
            if (!state.doc || !doc || state.doc.name !== doc.name) state.results = {};
            state.doc = doc;
          },
          function (e) {
            state.doc = null;
            state.message = t("Could not read the document: {error}", { error: e.message });
          },
        ),
        ping(),
      ])
        .then(resolveUnknown)
        .then(function () {
        checking = false;
        render();
        if (auto && prefs.auto && state.connected && missingNames().some(function (n) {
          return !state.results[n];
        })) {
          return activate();
        }
      });
    }

    /** Fonts the host cannot judge are checked by Typeshelf against the operating system. */
    function resolveUnknown() {
      var unknown = state.doc
        ? state.doc.fonts.filter(function (f) {
            return typeof f.installed !== "boolean";
          })
        : [];
      if (!unknown.length || !state.connected) return;
      return host
        .call("POST", "/v1/fonts/status", {
          fonts: unknown.map(function (f) {
            return f.name;
          }),
        })
        .then(
          function (res) {
            var byName = {};
            (res.results || []).forEach(function (r) {
              byName[r.name] = r;
            });
            unknown.forEach(function (f) {
              var r = byName[f.name];
              if (r) f.installed = !!r.available || (!!f.appLists && !r.inLibrary);
            });
          },
          function () {
            /* stays "To check" */
          },
        );
    }

    function activate() {
      var names = missingNames();
      if (!names.length || state.busy) return Promise.resolve();
      state.busy = true;
      state.message = "";
      render();
      return host
        .call("POST", "/v1/fonts/activate", { fonts: names, scope: prefs.scope, google: prefs.google })
        .then(
          function (res) {
            (res.results || []).forEach(function (r) {
              state.results[r.name] = r;
            });
            var done = (res.results || []).filter(function (r) {
              return r.status === "activated" || r.status === "active" || r.status === "system";
            }).length;
            var left = names.length - done;
            state.message = done
              ? t(done > 1 ? "{n} fonts activated" : "{n} font activated", { n: done }) +
                (left ? ", " + t(left > 1 ? "{n} not found (several)" : "{n} not found", { n: left }) : "") +
                "."
              : t(prefs.google ? "None of these fonts is in Typeshelf or on Google Fonts" : "None of these fonts is in Typeshelf") + ".";
          },
          function (e) {
            state.connected = false;
            state.message = e.message;
          },
        )
        .then(function () {
          state.busy = false;
          render();
          // Give the application a moment to notice the new fonts, then refresh the list.
          setTimeout(function () {
            check(false);
          }, 1500);
        });
    }

    function applyFont(name, retries) {
      return Promise.resolve()
        .then(function () {
          return host.applyFont(name);
        })
        .then(function (r) {
          if (r.error) return { ok: false, error: r.error };
          if (!r.retry) return { ok: true, count: r.count };
          // A font activated a moment ago may not be listed yet.
          if (retries <= 0) return { ok: false, error: "font_unavailable" };
          return new Promise(function (resolve) {
            setTimeout(resolve, APPLY_RETRY_MS);
          }).then(function () {
            return applyFont(name, retries - 1);
          });
        });
    }

    function readSelection() {
      return Promise.resolve()
        .then(function () {
          return host.selection();
        })
        .then(function (r) {
          return r.error ? { ok: false, error: r.error } : { ok: true, count: r.count, selection: r };
        });
    }

    /** Carries out one command from Typeshelf and reports how it went. */
    function run(command) {
      var report = function (outcome) {
        outcome.id = command.id;
        outcome.kind = command.kind;
        return host.call("POST", "/v1/bridge/result", outcome);
      };
      var work = command.kind === "apply" ? applyFont(command.font, APPLY_RETRIES) : readSelection();
      return work
        .then(report, function (e) {
          return report({ ok: false, error: messageOf(e) });
        })
        .then(
          function () {
            if (command.kind === "apply") check(false);
          },
          function () {
            /* Typeshelf quit meanwhile: nothing to report to */
          },
        );
    }

    function setConnected(connected) {
      if (state.connected === connected) return;
      state.connected = connected;
      render();
      // Fonts left "To check" can be judged now.
      if (connected) check(false);
    }

    /** Typeshelf cannot call the application: ask it what it wants, over and over. */
    function poll() {
      host
        .call("POST", "/v1/bridge/poll", { document: state.doc ? state.doc.name : null, can: can })
        .then(
          function (res) {
            pollFailures = 0;
            setConnected(true);
            (res.commands || []).forEach(function (command) {
              commands = commands.then(function () {
                return run(command);
              });
            });
            return POLL_MS;
          },
          function () {
            // One failure may only be a busy server: check before saying it is gone.
            if (++pollFailures !== 3) return pollFailures > 3 ? IDLE_MS : POLL_MS;
            var before = state.connected;
            return ping().then(function () {
              if (state.connected !== before) render();
              return IDLE_MS;
            });
          },
        )
        .then(function (delay) {
          setTimeout(poll, delay);
        });
    }

    /** The panel's button: shows the selected text in every font of the library. */
    function sendSelection() {
      state.message = "";
      readSelection()
        .then(function (outcome) {
          if (outcome.ok) return host.call("POST", "/v1/bridge/selection", { selection: outcome.selection });
          state.message =
            outcome.error === "no_selection" ? t("Select some text first.") : outcome.error === "no_document" ? t("No document open.") : outcome.error;
        })
        .catch(function (e) {
          state.message = messageOf(e);
        })
        .then(render);
    }

    container.addEventListener("click", function (e) {
      var id = e.target && e.target.id;
      if (id === "ts-activate") activate();
      else if (id === "ts-check") check(false);
      else if (id === "ts-preview") sendSelection();
    });
    container.addEventListener("change", function (e) {
      var t = e.target;
      if (t.id === "ts-auto") prefs.auto = !!t.checked;
      else if (t.id === "ts-google") prefs.google = !!t.checked;
      else if (t.id === "ts-scope") prefs.scope = t.value === "persistent" ? "persistent" : "temporary";
      else return;
      savePrefs();
    });

    var pending = null;
    host.onDocumentChange(function () {
      // Hosts fire several events in a row when a document opens.
      clearTimeout(pending);
      pending = setTimeout(function () {
        check(true);
      }, 400);
    });

    render();
    check(true);
    if (can.length) poll();
    return { check: check, activate: activate };
  }

  // UXP loads this file with require(); CEP with a <script> tag. With Node.js enabled, CEP
  // pages also see a global `module`, so the window export must not depend on its absence.
  create.t = t;
  if (typeof module !== "undefined" && module.exports) module.exports = create;
  if (root) root.TypeshelfPanel = create;
})(typeof window !== "undefined" ? window : this);

    </script>
    <script>
/*
 * Typeshelf for Figma, panel side (inlined into ui.html by plugins/shared/build-figma.mjs).
 * This iframe has no origin ("null"), so it talks to Typeshelf on its own routes, /v1/figma/…,
 * which accept it only with the token Typeshelf wrote into this file when it installed the plugin.
 */
(function () {
  "use strict";
  var TOKEN = "__TYPESHELF_TOKEN__";
  var BASES = ["http://localhost:47391", "http://127.0.0.1:47391"];
  var t = window.TypeshelfPanel.t;
  var base = 0;

  function once(index, method, path, body) {
    var controller = new AbortController();
    var timer = setTimeout(function () {
      controller.abort();
    }, method === "GET" ? 3000 : 120000); // Google Fonts downloads can take a while
    return fetch(BASES[index] + "/v1/figma" + path.replace(/^\/v1/, ""), {
      method: method,
      signal: controller.signal,
      headers: { "Content-Type": "application/json", "X-Typeshelf-Client": "Figma", "X-Typeshelf-Token": TOKEN },
      body: body ? JSON.stringify(body) : undefined,
    }).then(
      function (res) {
        clearTimeout(timer);
        return res.json().then(
          function (data) {
            return { status: res.status, data: data };
          },
          function () {
            return { status: res.status, data: {} };
          },
        );
      },
      function (e) {
        clearTimeout(timer);
        e.network = true;
        throw e;
      },
    );
  }

  function call(method, path, body) {
    var order = [base, 1 - base];
    function attempt(i) {
      return once(order[i], method, path, body).then(
        function (r) {
          base = order[i];
          if (r.status >= 200 && r.status < 300) return r.data;
          if (r.status === 401) throw new Error(t("Typeshelf does not recognise this plugin: install it again from Typeshelf."));
          throw new Error((r.data && r.data.error) || t("Error {status}", { status: r.status }));
        },
        function (e) {
          if (e.network && i + 1 < order.length) return attempt(i + 1);
          throw new Error(t("Typeshelf is not open or does not accept plugins."));
        },
      );
    }
    return attempt(0);
  }

  var waiting = [];
  var listeners = [];
  window.onmessage = function (event) {
    var m = event.data && event.data.pluginMessage;
    if (!m) return;
    if (m.type === "fonts" || m.type === "error") {
      var done = waiting;
      waiting = [];
      done.forEach(function (w) {
        if (m.type === "error") w.reject(new Error(m.message));
        else
          w.resolve({
            name: m.name,
            fonts: m.fonts.map(function (f) {
              return { name: f.name, installed: f.installed };
            }),
          });
      });
    } else if (m.type === "changed") {
      listeners.forEach(function (cb) {
        cb();
      });
    }
  };

  var host = {
    name: "Figma",
    call: call,
    documentFonts: function () {
      return new Promise(function (resolve, reject) {
        waiting.push({ resolve: resolve, reject: reject });
        parent.postMessage({ pluginMessage: { type: "scan" } }, "*");
      });
    },
    onDocumentChange: function (cb) {
      listeners.push(cb);
    },
  };

  window.TypeshelfPanel(host, document.getElementById("app"));
})();

    </script>
  </body>
</html>
